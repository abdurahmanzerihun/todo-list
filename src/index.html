<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
</head>
<body>
      <h1>The todo app</h1>
      <form action="" id="proj-form">
            <input type="text" id="proj-input" placeholder="New project">
            <button id="add-proj">Add project</button>
      </form> 
      <form id="item-form">
  <input id="item-input" placeholder="New item" />
   <button id="add-item">Add item</button>
</form>
 <form id="todo-form">
  <input id="todo-input" placeholder="New todo" />
   <button id="add-todo">Add todo</button>
</form>
<ul id="project-list"></ul>
<ul id="item-list"></ul>
<ul id="todo-list"></ul>

</body>
</html>
