<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="sidebar-title">Projects</h2>

      <ul id="project-list" class="project-list">
        <!-- projects rendered here -->
      </ul>

      <button id="add-project-btn" class="primary-btn" type="button">
        + Add Project
      </button>
    </aside>
    <!-- Main Content -->
    <main class="content">
      <header class="content-header">
        <h2 id="active-project-title">Select a project</h2>
      </header>

      <!-- Sections -->
      <div id="section-container" class="sections">
        <!-- section rendered here -->
        <!-- Example section -->
      
        <section class="section">
          <div class="section-header">
            <h3 class="section-title">Today</h3>
            <button class="add-todo-btn">+ Todo</button>
          </div>

          <ul class="todo-list">
            <li class="todo">
              <input type="checkbox" />
              <span class="todo-title">Finish report</span>
            </li>
          </ul>
        </section>
        
      </div>

      <button id="add-item-btn" class="secondary-btn">
        + Add Section
      </button>
    </main>
  </div>
  <dialog id="proj-dialog">
         <form action="" id="proj-form">
            <input type="text" id="proj-title" placeholder="Project title">
            <select name="priorityid" id="proj-priority">
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
            </select>
            <textarea type="text" id="proj-description"></textarea>
            <button id="add-proj">Add project</button>
      </form>    
      </dialog>
      <dialog id="item-dialog">
               <form id="item-form">
  <input id="item-input" placeholder="New item" />
   <button id="add-item">Add item</button>
</form>
      </dialog>
   <dialog id="todo-dialog">
      <form id="todo-form">
  <input id="todo-title" placeholder="New todo" />
 <select name="" id="todo-priority">
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
 </select>
 <input type="date" name="" id="due-date">
 <textarea id="todo-description"></textarea>
   <button id="add-todo">Add todo</button>
</form>
   </dialog>
<!--Update project form -->
   <dialog id="update-dialog">
<form id="update-form">
<input type="text" id="update-title" placeholder="Project title">
            <select name="priorityid" id="update-priority">
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
            </select>
            <textarea type="text" id="update-desc"></textarea>
            <button id="update-proj">Update project</button>
</form>
   </dialog>

   <!--Update item form -->
  <dialog id="update-item-dialog">
               <form id="update-item-form">
  <input id="update-item-input" placeholder="New item" />
   <button id="update-add-item">Update item</button>
</form>
      </dialog>
      <!--update todo form-->
<dialog id="update-todo-dialog">
  <button id="close-btn">Close</button>
      <form id="update-todo-form">
  <input id="update-todo-title" placeholder="New todo" />
 <select name="" id="update-todo-priority">
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
 </select>
 <input type="date" name="" id="update-due-date">
 <textarea id="update-todo-desc"></textarea>
   <button id="update-todo">Update todo</button>
</form>
   </dialog>
</body>
</html>
